<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการหลังบ้าน</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #fdf2f8; color: #1f2937; } 
        #global-loader { display: none; position: fixed; inset: 0; background: rgba(255,255,255,0.8); z-index: 9999; align-items: center; justify-content: center; flex-direction: column; }
        #toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .toast { min-width: 250px; padding: 1rem; border-radius: 0.5rem; color: white; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); animation: slideIn 0.3s ease-out forwards; display: flex; align-items: center; gap: 0.5rem; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .seat { width: 30px; height: 30px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: bold; color: #4b5563; }
        .seat.standard-available { background-color: #fce7f3; border: 1px solid #f9a8d4; }
        .seat.vip-locked { background-color: #fcd34d !important; border: 1px solid #fbbf24 !important; color: #b45309 !important; }
        .seat.booked { background-color: #ef4444 !important; border: 1px solid #dc2626 !important; color: white !important; }
        .cinema-screen { height: 40px; background: #fce7f3; border-radius: 4px; margin-bottom: 1rem; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #be185d; letter-spacing: 0.1em; border: 1px solid #f9a8d4; }
        
        /* สไตล์สำหรับ Print */
        @media print { 
            body * { visibility: hidden; } 
            
            /* Print ผังที่นั่ง */
            .print-active-map #admin-map-print-area, .print-active-map #admin-map-print-area * { visibility: visible; } 
            .print-active-map #admin-map-print-area { position: absolute; left: 0; top: 0; width: 100%; } 
            
            /* Print รายงาน (บังคับแสดงด้วย block !important) */
            .print-active-report #print-report-area { display: block !important; visibility: visible !important; position: absolute; left: 0; top: 0; width: 100%; background: white; }
            .print-active-report #print-report-area * { visibility: visible !important; }
            
            .print\:hidden { display: none !important; } 
        }
        
        /* ซ่อนหน้าต่าง Print ปกติ */
        #print-report-area { display: none; padding: 20px; }
        #print-report-area table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
        #print-report-area th, #print-report-area td { border: 1px solid #f9a8d4; padding: 8px; text-align: left; color: #000; }
        #print-report-area th { background-color: #fce7f3; color: #9d174d; font-weight: bold; }
    </style>
</head>
<body class="min-h-screen">

    <div id="global-loader"><i class="fa-solid fa-circle-notch fa-spin text-5xl text-pink-600 mb-4"></i><p class="text-gray-700 font-semibold" id="loader-text">กำลังดำเนินการ...</p></div>

    <!-- หน้าต่าง Login (อิงสีและโครงสร้างให้สะอาดตา) -->
    <div id="admin-login-modal" class="fixed inset-0 bg-[#5b5f68] z-50 flex items-center justify-center print:hidden p-4">
        <div class="bg-white p-8 rounded-xl shadow-2xl max-w-[400px] w-full relative">
            <h2 class="text-xl font-bold mb-6 text-center text-[#de2c7c]">เข้าสู่ระบบผู้ดูแลระบบ</h2>
            <div class="space-y-4">
                <div>
                    <label class="text-xs text-gray-500 mb-1 block">Username</label>
                    <input type="text" id="admin-user" class="w-full border border-gray-200 p-2.5 rounded outline-none focus:border-pink-500">
                </div>
                <div>
                    <label class="text-xs text-gray-500 mb-1 block">Password</label>
                    <input type="password" id="admin-pass" class="w-full border border-gray-200 p-2.5 rounded outline-none focus:border-pink-500" onkeypress="if(event.key === 'Enter') loginAdmin();">
                </div>
                
                <div class="mt-6 pt-2">
                    <button onclick="loginAdmin()" class="w-full bg-[#de2c7c] hover:bg-pink-700 text-white font-bold py-2.5 rounded shadow transition">เข้าสู่ระบบ</button>
                </div>
                
                <!-- ปุ่มกลับหน้าหลัก -->
                <div class="text-center mt-4 pt-3 border-t border-gray-100">
                    <button onclick="window.location.href='Testindex.html'" class="text-sm font-bold text-gray-500 hover:text-[#de2c7c] transition">
                        <i class="fa-solid fa-arrow-left mr-1"></i> กลับหน้าหลัก
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- แผงควบคุม (Dashboard) -->
    <div id="admin-dashboard" class="hidden flex-col min-h-screen p-4 md:p-8 z-10 print:hidden">
        <div class="flex flex-col md:flex-row justify-between items-center mb-6 bg-white p-4 rounded-xl shadow-sm gap-4 border border-pink-100 border-t-4 border-t-pink-500">
            <h1 class="text-2xl font-bold text-pink-800"><i class="fa-solid fa-shield-halved mr-2"></i> ระบบจัดการหลังบ้าน <span id="dash-event-name" class="text-sm text-gray-500 ml-2"></span></h1>
            <div class="flex flex-wrap gap-2 justify-center">
                <button onclick="openAdminBooking()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg text-sm shadow"><i class="fa-solid fa-ticket"></i> จองที่นั่ง (ไม่จำกัด)</button>
                <button onclick="showAdminMap()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm shadow"><i class="fa-solid fa-map"></i> ดูแผนผัง</button>
                <button onclick="openExportModal()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm shadow"><i class="fa-solid fa-print"></i> พิมพ์ / โหลดข้อมูล</button>
                <button onclick="logoutAdmin()" class="bg-gray-500 hover:bg-gray-600 text-white px-4 py-2 rounded-lg text-sm shadow"><i class="fa-solid fa-power-off"></i> ออกจากระบบ</button>
            </div>
        </div>
        <div class="bg-white p-6 rounded-xl shadow-lg flex-grow overflow-hidden flex flex-col border border-pink-100">
            <div class="flex justify-between mb-4 items-center">
                <h2 class="text-xl font-bold text-gray-800">รายการจองที่นั่งทั้งหมด</h2>
                <button onclick="loadAdminData()" class="bg-pink-100 text-pink-700 px-4 py-2 rounded font-bold hover:bg-pink-200 transition"><i class="fa-solid fa-rotate mr-1"></i> รีเฟรชข้อมูล</button>
            </div>
            <div class="overflow-x-auto rounded-lg border border-pink-200 flex-grow">
                <table class="w-full text-sm text-left text-gray-600 whitespace-nowrap">
                    <thead class="text-xs text-pink-800 uppercase bg-pink-50 sticky top-0 shadow-sm">
                        <tr><th class="px-4 py-3">วันเวลาที่จอง</th><th class="px-4 py-3">สมาชิก</th><th class="px-4 py-3">ที่นั่ง</th><th class="px-4 py-3">ชื่อ-สกุล</th><th class="px-4 py-3">เบอร์/อีเมล</th><th class="px-4 py-3">RefCode</th><th class="px-4 py-3 text-center">จัดการ</th></tr>
                    </thead>
                    <tbody id="admin-table-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal ตัวเลือก Print/Export -->
    <div id="admin-export-modal" class="hidden fixed inset-0 bg-gray-900 bg-opacity-75 z-50 flex items-center justify-center backdrop-blur-sm print:hidden p-4">
        <div class="bg-white p-6 rounded-2xl shadow-2xl max-w-md w-full relative border-t-8 border-pink-500">
            <h2 class="text-xl font-bold mb-4 text-pink-700 border-b border-pink-100 pb-2"><i class="fa-solid fa-print"></i> พิมพ์ / ดาวน์โหลดข้อมูล</h2>
            <div class="space-y-4 mt-4">
                <div>
                    <label class="block text-sm font-bold text-gray-700 mb-2">เลือกประเภทข้อมูล:</label>
                    <select id="export-type" onchange="toggleExportOptions()" class="w-full border border-pink-200 p-2 rounded focus:ring-pink-500 outline-none">
                        <option value="bookings">รายงานการจองที่นั่ง (เรียงตามที่นั่ง)</option>
                        <option value="operations">ประวัติการแก้ไขและยกเลิกที่นั่ง</option>
                    </select>
                </div>
                <div id="export-center-wrapper">
                    <label class="block text-sm font-bold text-gray-700 mb-2">เลือกศูนย์บริการ:</label>
                    <select id="export-center" class="w-full border border-pink-200 p-2 rounded focus:ring-pink-500 outline-none">
                        <option value="all">ข้อมูลทั้งหมด (ทุกศูนย์ฯ)</option>
                        <option value="ศูนย์นันทนาการสะพานพระราม 9">ศูนย์นันทนาการสะพานพระราม 9</option>
                        <option value="ศูนย์นันทนาการทุ่งครุ">ศูนย์นันทนาการทุ่งครุ</option>
                        <option value="ศูนย์นันทนาการจอมทอง">ศูนย์นันทนาการจอมทอง</option>
                        <option value="ศูนย์นันทนาการเวฬุราชิน">ศูนย์นันทนาการเวฬุราชิน</option>
                        <option value="ศูนย์นันทนาการบางขุนเทียน">ศูนย์นันทนาการบางขุนเทียน</option>
                        <option value="ศูนย์นันทนาการอัมพวา">ศูนย์นันทนาการอัมพวา</option>
                    </select>
                </div>
                <div class="flex flex-col gap-2 mt-6">
                    <div class="flex gap-2">
                        <button type="button" onclick="executePrint()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded shadow"><i class="fa-solid fa-print"></i> พิมพ์ (Print)</button>
                        <button type="button" onclick="executeExport()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2 rounded shadow"><i class="fa-solid fa-file-excel"></i> โหลด CSV</button>
                    </div>
                    <button type="button" onclick="closeExportModal()" class="w-full bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 rounded">ยกเลิก</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- พื้นที่สำหรับแสดงข้อมูลก่อนสั่งพิมพ์ -->
    <div id="print-report-area"></div>

    <!-- Modal แก้ไขข้อมูล -->
    <div id="admin-edit-modal" class="hidden fixed inset-0 bg-gray-900 bg-opacity-75 z-50 flex items-center justify-center backdrop-blur-sm print:hidden p-4">
        <div class="bg-white p-6 rounded-2xl shadow-2xl max-w-lg w-full relative max-h-[90vh] overflow-y-auto border-t-8 border-pink-500">
            <h2 class="text-xl font-bold mb-4 text-pink-700 border-b border-pink-100 pb-2">แก้ไขข้อมูลและที่นั่ง</h2>
            <form id="edit-booking-form" class="space-y-3">
                <input type="hidden" id="edit-ref">
                <div class="bg-pink-50 p-3 rounded border border-pink-200 overflow-x-auto mb-2">
                    <p class="text-xs font-bold text-pink-700 mb-2">คลิกเลือกที่นั่งใหม่จากผัง</p>
                    <div id="admin-mini-seat-grid" class="inline-grid gap-1"></div>
                </div>
                <div class="grid grid-cols-3 gap-2">
                    <div class="col-span-1"><label class="block text-xs font-medium text-gray-700">ที่นั่งที่เลือก</label>
                        <input type="text" id="edit-seat" readonly class="w-full border border-pink-200 p-2 rounded outline-none font-bold text-center bg-white text-pink-700">
                    </div>
                    <div class="col-span-2"><label class="block text-xs font-medium text-gray-700">คำนำหน้า</label>
                        <select id="edit-title" class="w-full border border-pink-200 p-2 rounded focus:ring-pink-500 outline-none"><option value="นาย">นาย</option><option value="นาง">นาง</option><option value="นางสาว">นางสาว</option></select>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div><label class="block text-xs font-medium text-gray-700">ชื่อ</label><input type="text" id="edit-fname" class="w-full border border-pink-200 focus:border-pink-500 p-2 rounded outline-none"></div>
                    <div><label class="block text-xs font-medium text-gray-700">นามสกุล</label><input type="text" id="edit-lname" class="w-full border border-pink-200 focus:border-pink-500 p-2 rounded outline-none"></div>
                </div>
                <div><label class="block text-xs font-medium text-gray-700">เบอร์โทรศัพท์</label><input type="text" id="edit-phone" class="w-full border border-pink-200 focus:border-pink-500 p-2 rounded outline-none"></div>
                <div><label class="block text-xs font-medium text-gray-700">อีเมล</label><input type="text" id="edit-email" class="w-full border border-pink-200 focus:border-pink-500 p-2 rounded outline-none"></div>
                <div class="flex gap-2 mt-4 pt-4 border-t border-pink-100">
                    <button type="button" onclick="saveEditBooking()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2 rounded">บันทึก & ส่งตั๋วใหม่</button>
                    <button type="button" onclick="closeEditModal()" class="w-full bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 rounded">ยกเลิก/ปิด</button>
                </div>
            </form>
        </div>
    </div>
    
    <!-- Modal แผนผังภาพรวม -->
    <div id="admin-map-modal" class="hidden fixed inset-0 bg-white z-[60] flex-col print:flex">
        <div class="p-4 bg-gray-800 text-white flex justify-between items-center print:hidden border-b-4 border-pink-500">
            <h2 class="text-xl font-bold"><i class="fa-solid fa-map-location-dot text-pink-400"></i> แผนผังที่นั่งปัจจุบัน</h2>
            <div class="flex gap-3">
                <button onclick="printAdminMap()" class="bg-blue-500 hover:bg-blue-600 px-4 py-2 rounded font-bold"><i class="fa-solid fa-print"></i> พิมพ์แผนผัง</button>
                <button onclick="closeAdminMap()" class="bg-red-500 hover:bg-red-600 px-4 py-2 rounded font-bold"><i class="fa-solid fa-times"></i> ปิด</button>
            </div>
        </div>
        <div id="admin-map-print-area" class="flex-grow p-4 overflow-auto text-center bg-pink-50/30">
            <h1 class="text-2xl font-bold text-gray-800 mb-2">แผนผังที่นั่ง <span id="admin-map-title" class="text-pink-700"></span></h1>
            <div class="cinema-screen mx-auto max-w-3xl mt-4 mb-6">SCREEN / เวที</div>
            <div class="flex justify-center relative"><div id="admin-seat-grid" style="display: inline-grid; gap: 0.3rem;"></div></div>
        </div>
    </div>

    <div id="toast-container"></div>

    <script>
        // ==========================================
        // 🚨 นำ Web App URL ของ Google Apps Script มาใส่ตรงนี้ 🚨
        // ==========================================
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyNzMq5UhPyz_QbTR73IOMcQTxYjUATjPMR-BwUNIpqaJeSexg9bbDtjpc8Oj1zH_s/exec'; 
        
        let adminBookingsData = []; let eventNameData = "";
        const ROWS = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J']; const SEATS_PER_ROW = 15; const VIP_ROWS = ['A', 'E']; 

        // ตรวจสอบ Session ล็อกอิน
        window.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('bma_admin_logged_in') === 'true') {
                document.getElementById('admin-login-modal').classList.add('hidden');
                document.getElementById('admin-dashboard').classList.remove('hidden');
                document.getElementById('admin-dashboard').classList.add('flex');
                initDashboard();
            }
        });

        async function fetchAPI(action, data = {}) {
            data.action = action;
            try { const response = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(data), headers: { 'Content-Type': 'text/plain;charset=utf-8' } }); return await response.json(); } catch (error) { throw error; }
        }

        function showLoader(text) { document.getElementById('loader-text').innerText = text; document.getElementById('global-loader').style.display = 'flex'; }
        function hideLoader() { document.getElementById('global-loader').style.display = 'none'; }
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container'); const toast = document.createElement('div');
            let bgClass = type === 'success' ? 'bg-green-600' : type === 'warning' ? 'bg-yellow-500 text-yellow-900' : type === 'error' ? 'bg-red-600' : 'bg-gray-800';
            toast.className = `toast ${bgClass}`; toast.innerHTML = `<span>${message}</span>`; container.appendChild(toast);
            setTimeout(() => { toast.style.animation = 'fadeOut 0.3s ease-out forwards'; setTimeout(() => toast.remove(), 300); }, 3000);
        }

        async function loginAdmin() {
            const u = document.getElementById('admin-user').value; const p = document.getElementById('admin-pass').value;
            if(!u || !p) { showToast('กรุณากรอกข้อมูล', 'warning'); return; }
            showLoader('ตรวจสอบสิทธิ์...');
            try {
                const res = await fetchAPI('login', {username: u, password: p});
                if(res.status === 'success') { 
                    localStorage.setItem('bma_admin_logged_in', 'true');
                    document.getElementById('admin-login-modal').classList.add('hidden'); 
                    document.getElementById('admin-dashboard').classList.remove('hidden'); 
                    document.getElementById('admin-dashboard').classList.add('flex'); 
                    initDashboard(); 
                } else { showToast(res.message, "error"); }
            } catch(e) {} hideLoader();
        }

        function logoutAdmin() { 
            localStorage.removeItem('bma_admin_logged_in'); 
            location.reload(); 
        }

        async function initDashboard() {
            try { const res = await fetchAPI('getSettings'); if(res.status === 'success') { eventNameData = res.eventName; document.getElementById('dash-event-name').innerText = `(${res.eventName})`; } } catch(e){} loadAdminData();
        }

        async function loadAdminData() {
            showLoader('กำลังโหลดข้อมูลการจอง...');
            try {
                const res = await fetchAPI('get_bookings');
                if(res.status === 'success') {
                    adminBookingsData = res.data; const tbody = document.getElementById('admin-table-body'); tbody.innerHTML = '';
                    for(let i=1; i<res.data.length; i++){
                        const row = res.data[i]; const dateObj = new Date(row[0]);
                        const rowHtml = `<tr class="border-b border-pink-100 hover:bg-pink-50/50">
                            <td class="px-4 py-3 text-xs">${dateObj.toLocaleDateString('th-TH')} ${dateObj.toLocaleTimeString('th-TH')}</td>
                            <td class="px-4 py-3 font-semibold text-pink-700">${row[1]}</td>
                            <td class="px-4 py-3"><span class="bg-pink-100 text-pink-800 border border-pink-200 px-2 py-1 rounded font-bold">${row[2]}</span></td>
                            <td class="px-4 py-3">${row[3]} ${row[4]} ${row[5]}</td>
                            <td class="px-4 py-3 text-xs">${row[6]}<br>${row[7]}</td>
                            <td class="px-4 py-3 font-mono font-bold text-gray-500 text-xs">${row[8]}</td>
                            <td class="px-4 py-3 text-center print:hidden">
                                <button onclick="openEditModal('${row[8]}', '${row[2]}', '${row[3]}', '${row[4]}', '${row[5]}', '${row[6]}', '${row[7]}')" class="text-blue-600 hover:text-white hover:bg-blue-600 px-2 py-1 rounded border border-blue-600 transition text-xs font-bold mr-1"><i class="fa-solid fa-pen"></i> แก้ไข</button>
                                <button onclick="cancelBooking('${row[8]}', '${row[2]}')" class="text-red-500 hover:text-white hover:bg-red-500 px-2 py-1 rounded border border-red-500 transition text-xs font-bold"><i class="fa-solid fa-ban"></i> ยกเลิก</button>
                            </td></tr>`;
                        tbody.innerHTML += rowHtml;
                    }
                }
            } catch(e) {} hideLoader();
        }

        async function openEditModal(ref, seat, title, fname, lname, phone, email) {
            document.getElementById('edit-ref').value = ref; document.getElementById('edit-title').value = title; 
            document.getElementById('edit-fname').value = fname; document.getElementById('edit-lname').value = lname; 
            document.getElementById('edit-phone').value = phone; document.getElementById('edit-email').value = email;
            document.getElementById('admin-edit-modal').classList.remove('hidden');
            showLoader('โหลดผังที่นั่ง...');
            try { const res = await fetchAPI('getSeats'); if(res.status === 'success') renderMiniMap(res.data, seat, 'admin-mini-seat-grid', 'edit-seat'); } catch(e){} hideLoader();
        }
        function closeEditModal() { document.getElementById('admin-edit-modal').classList.add('hidden'); }
        
        async function saveEditBooking() {
            const data = {
                refCode: document.getElementById('edit-ref').value, newSeat: document.getElementById('edit-seat').value.trim(), actionBy: "แอดมิน",
                title: document.getElementById('edit-title').value, fname: document.getElementById('edit-fname').value, 
                lname: document.getElementById('edit-lname').value, phone: document.getElementById('edit-phone').value, email: document.getElementById('edit-email').value
            };
            if(!data.newSeat) { showToast('กรุณาระบุที่นั่ง', 'warning'); return; }
            closeEditModal(); showLoader('กำลังอัปเดตและส่งตั๋วใหม่ (ใช้เวลาสักครู่)...');
            try {
                const res = await fetchAPI('edit_booking', data);
                if(res.status === 'success') { showToast('อัปเดตข้อมูลสำเร็จ ระบบได้ส่งตั๋วใหม่ให้ผู้จองแล้ว', 'success'); loadAdminData(); }
                else { showToast(res.message, 'error'); document.getElementById('admin-edit-modal').classList.remove('hidden'); }
            } catch(e) { showToast('เกิดข้อผิดพลาด', 'error'); } hideLoader();
        }

        async function cancelBooking(refCode, seatName) {
            if(!confirm(`ยืนยันการยกเลิกที่นั่ง ${seatName} ใช่หรือไม่?\n(ระบบจะลบข้อมูลและส่งอีเมลแจ้งเตือนผู้จองพร้อมตั๋วที่ประทับตรายกเลิก)`)) return;
            showLoader('กำลังยกเลิกและส่งอีเมลแจ้งเตือน...');
            try { 
                const res = await fetchAPI('cancel_booking', {refCode: refCode, actionBy: "แอดมิน"}); 
                if(res.status === 'success') { showToast('ยกเลิกที่นั่งสำเร็จ', 'success'); loadAdminData(); } 
            } catch(e) {} hideLoader();
        }

        function openExportModal() { document.getElementById('admin-export-modal').classList.remove('hidden'); }
        function closeExportModal() { document.getElementById('admin-export-modal').classList.add('hidden'); }
        function toggleExportOptions() {
            const type = document.getElementById('export-type').value;
            document.getElementById('export-center-wrapper').style.display = type === 'bookings' ? 'block' : 'none';
        }

        function sortSeatsData(dataArray) {
            return dataArray.sort((a, b) => {
                let seatA = String(a[2]); let seatB = String(b[2]);
                let rowA = seatA.charAt(0); let numA = parseInt(seatA.substring(1));
                let rowB = seatB.charAt(0); let numB = parseInt(seatB.substring(1));
                if (rowA === rowB) return numA - numB;
                return rowA.localeCompare(rowB);
            });
        }

        // ================= แก้ไขการทำงานของระบบสั่งพิมพ์ (Print) =================
        async function executePrint() {
            const exportType = document.getElementById('export-type').value;
            const selectedCenter = document.getElementById('export-center').value;
            let reportHtml = "";

            if (exportType === 'bookings') {
                if (adminBookingsData.length <= 1) { showToast('ไม่มีข้อมูลการจอง', 'warning'); return; }
                let filteredData = adminBookingsData.slice(1);
                if (selectedCenter !== 'all') { filteredData = filteredData.filter(row => row[1] === selectedCenter); }
                if (filteredData.length === 0) { showToast('ไม่พบข้อมูลศูนย์บริการนี้', 'warning'); return; }
                filteredData = sortSeatsData(filteredData);
                
                let titleStr = selectedCenter === 'all' ? "ทุกศูนย์นันทนาการ" : selectedCenter;
                reportHtml = `<h2 style="text-align:center; color:#9d174d; margin-bottom:15px; font-family:sans-serif;">รายงานการจองที่นั่ง - ${titleStr}</h2>`;
                reportHtml += `<table><tr><th>วันเวลาที่จอง</th><th>ศูนย์นันทนาการ</th><th>ที่นั่ง</th><th>ชื่อ-สกุล</th><th>เบอร์โทร</th><th>RefCode</th></tr>`;
                
                filteredData.forEach(row => {
                    let dateStr = new Date(row[0]).toLocaleString('th-TH');
                    reportHtml += `<tr><td>${dateStr}</td><td>${row[1]}</td><td><b>${row[2]}</b></td><td>${row[3]}${row[4]} ${row[5]}</td><td>${row[6]}</td><td>${row[8]}</td></tr>`;
                });
                reportHtml += `</table>`;
                
            } else if (exportType === 'operations') {
                showLoader('กำลังโหลดข้อมูลประวัติ...');
                try {
                    const res = await fetchAPI('get_operations');
                    if (res.status === 'success' && res.data.length > 1) {
                        let opsData = res.data.slice(1);
                        reportHtml = `<h2 style="text-align:center; color:#9d174d; margin-bottom:15px; font-family:sans-serif;">รายงานประวัติการแก้ไขและยกเลิกที่นั่ง</h2>`;
                        reportHtml += `<table><tr><th>ชื่อผู้จอง</th><th>เวลาจองเดิม</th><th>สถานะ</th><th>รายละเอียด</th><th>เวลาที่แก้ไข/ยกเลิก</th><th>ผู้ดำเนินการ</th></tr>`;
                        opsData.forEach(row => {
                            let d1 = row[1] ? new Date(row[1]).toLocaleString('th-TH') : "-";
                            let d2 = row[4] ? new Date(row[4]).toLocaleString('th-TH') : "-";
                            reportHtml += `<tr><td>${row[0]}</td><td>${d1}</td><td>${row[2]}</td><td>${row[3]}</td><td>${d2}</td><td>${row[5]}</td></tr>`;
                        });
                        reportHtml += `</table>`;
                    } else { showToast('ยังไม่มีประวัติการทำรายการ', 'warning'); hideLoader(); return; }
                } catch (e) { showToast('ดึงข้อมูลผิดพลาด', 'error'); hideLoader(); return; }
                hideLoader();
            }

            // แทรกโค้ดตารางลงไปใน DOM
            document.getElementById('print-report-area').innerHTML = reportHtml;
            closeExportModal();
            
            // สั่งเปิดโหมดพิมพ์
            document.body.classList.add('print-active-report');
            
            // หน่วงเวลาเล็กน้อยเพื่อให้เบราว์เซอร์จัดหน้า CSS ให้เสร็จก่อนสั่ง Print
            setTimeout(() => { 
                window.print(); 
                document.body.classList.remove('print-active-report'); 
                document.getElementById('print-report-area').innerHTML = ''; // ล้างข้อมูลออกหลังพิมพ์เสร็จ
            }, 500);
        }

        async function executeExport() {
            const exportType = document.getElementById('export-type').value;
            if (exportType === 'bookings') {
                if (adminBookingsData.length <= 1) { showToast('ไม่มีข้อมูลการจองให้ดาวน์โหลด', 'warning'); return; }
                const selectedCenter = document.getElementById('export-center').value;
                let filteredData = adminBookingsData.slice(1);
                if (selectedCenter !== 'all') { filteredData = filteredData.filter(row => row[1] === selectedCenter); }
                if (filteredData.length === 0) { showToast('ไม่พบข้อมูลสำหรับศูนย์บริการที่เลือก', 'warning'); return; }

                filteredData = sortSeatsData(filteredData);
                let csvContent = "data:text/csv;charset=utf-8,\uFEFFวันเวลาที่จอง,ศูนย์นันทนาการ (สมาชิก),ที่นั่ง,คำนำหน้า,ชื่อ,นามสกุล,เบอร์โทร,อีเมล,RefCode\n";
                for(let i=0; i<filteredData.length; i++){
                    let row = filteredData[i]; let dateStr = new Date(row[0]).toLocaleString('th-TH');
                    csvContent += `"${dateStr}","${row[1]}","${row[2]}","${row[3]}","${row[4]}","${row[5]}","${row[6]}","${row[7]}","${row[8]}"\n`;
                }
                let fileName = selectedCenter === 'all' ? "รายงานการจองที่นั่ง_ทั้งหมด.csv" : `รายงานการจองที่นั่ง_${selectedCenter}.csv`;
                downloadFile(csvContent, fileName);
                closeExportModal();
            } 
            else if (exportType === 'operations') {
                showLoader('กำลังโหลดประวัติการดำเนินงาน...');
                try {
                    const res = await fetchAPI('get_operations');
                    if (res.status === 'success' && res.data.length > 1) {
                        let opsData = res.data;
                        let csvContent = "data:text/csv;charset=utf-8,\uFEFFชื่อผู้จอง,วันเวลาที่จอง (อ้างอิง),สถานะ,รายละเอียด,วันเวลาดำเนินการ,ผู้ดำเนินการ\n";
                        for(let i=1; i<opsData.length; i++){
                            let row = opsData[i]; 
                            let bookDateStr = row[1] ? new Date(row[1]).toLocaleString('th-TH') : "-";
                            let opDateStr = row[4] ? new Date(row[4]).toLocaleString('th-TH') : "-";
                            csvContent += `"${row[0]}","${bookDateStr}","${row[2]}","${row[3]}","${opDateStr}","${row[5]}"\n`;
                        }
                        downloadFile(csvContent, "ประวัติการแก้ไขและยกเลิก_Operations.csv");
                        closeExportModal();
                    } else { showToast('ยังไม่มีประวัติการดำเนินงาน', 'warning'); }
                } catch (e) { showToast('ดึงข้อมูลผิดพลาด', 'error'); }
                hideLoader();
            }
        }
        
        function downloadFile(content, filename) {
            var encodedUri = encodeURI(content); var link = document.createElement("a");
            link.setAttribute("href", encodedUri); link.setAttribute("download", filename);
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
        }

        // --- เปลี่ยนจากการเปิดแท็บใหม่ เป็นการเปลี่ยนหน้าต่างเดิม ---
        function openAdminBooking() { window.location.href = "Testindex.html?admin=true"; }

        function printAdminMap() {
            document.body.classList.add('print-active-map');
            window.print();
            document.body.classList.remove('print-active-map');
        }

        async function showAdminMap() {
            document.getElementById('admin-map-modal').classList.remove('hidden'); document.getElementById('admin-map-title').innerText = eventNameData;
            showLoader('กำลังโหลดแผนผัง...');
            try {
                const response = await fetchAPI('getSeats');
                if (response.status === 'success') {
                    let seatsMap = response.data || {}; const grid = document.getElementById('admin-seat-grid');
                    grid.style.gridTemplateColumns = `auto repeat(${SEATS_PER_ROW}, minmax(0, 1fr))`; grid.innerHTML = '';
                    ROWS.forEach(row => {
                        const label = document.createElement('div'); label.className = "flex items-center justify-center font-bold text-gray-500 pr-2 text-xs"; label.innerText = row; grid.appendChild(label);
                        const isVIP = VIP_ROWS.includes(row);
                        for (let i = 1; i <= SEATS_PER_ROW; i++) {
                            const seatId = `${row}${i}`; const seat = document.createElement('div');
                            if (isVIP) { seat.className = 'seat vip-locked'; seat.innerText = 'VIP'; } 
                            else { 
                                seat.className = 'seat standard-available'; seat.innerText = seatId; 
                                if(seatsMap[seatId] && seatsMap[seatId].status === 'booked') { seat.className = 'seat booked'; }
                            }
                            grid.appendChild(seat);
                        }
                    });
                }
            } catch(e) { showToast('ไม่สามารถโหลดแผนผังได้', 'error'); } hideLoader();
        }
        function closeAdminMap() { document.getElementById('admin-map-modal').classList.add('hidden'); }

        function renderMiniMap(seatsMap, currentSeat, containerId, inputId) {
            const grid = document.getElementById(containerId); grid.style.gridTemplateColumns = `auto repeat(${SEATS_PER_ROW}, minmax(0, 1fr))`; grid.innerHTML = '';
            document.getElementById(inputId).value = currentSeat;
            ROWS.forEach(row => {
                const label = document.createElement('div'); label.className = "flex items-center justify-center font-bold text-gray-500 pr-1 text-[10px]"; label.innerText = row; grid.appendChild(label);
                const isVIP = VIP_ROWS.includes(row);
                for (let i = 1; i <= SEATS_PER_ROW; i++) {
                    const seatId = `${row}${i}`; const seat = document.createElement('div'); seat.className = "w-7 h-7 rounded flex items-center justify-center text-[10px] font-bold transition ";
                    if (seatId === currentSeat) {
                        seat.className += "bg-blue-500 text-white border-blue-600 border ring-2 ring-blue-300 current-seat-mark cursor-pointer"; seat.innerText = seatId;
                    } else if (isVIP) { seat.className += "bg-yellow-400 text-yellow-900 opacity-60 cursor-not-allowed"; seat.innerText = 'V';
                    } else if (seatsMap[seatId] && seatsMap[seatId].status === 'booked') { seat.className += "bg-red-500 text-white opacity-60 cursor-not-allowed"; seat.innerText = seatId;
                    } else {
                        seat.className += "bg-pink-100 text-pink-700 border-pink-300 border hover:bg-pink-200 cursor-pointer"; seat.innerText = seatId;
                        seat.onclick = function() {
                            document.querySelectorAll(`#${containerId} .selected-new`).forEach(el => { el.classList.remove('selected-new', 'bg-green-500', 'text-white', 'border-green-600'); el.classList.add('bg-pink-100', 'text-pink-700', 'border-pink-300'); });
                            document.querySelectorAll(`#${containerId} .current-seat-mark`).forEach(el => { el.classList.remove('bg-gray-400'); el.classList.add('bg-blue-500'); });
                            if(seatId !== currentSeat) { this.classList.remove('bg-pink-100', 'text-pink-700', 'border-pink-300'); this.classList.add('selected-new', 'bg-green-500', 'text-white', 'border-green-600'); document.querySelectorAll(`#${containerId} .current-seat-mark`).forEach(el => { el.classList.remove('bg-blue-500'); el.classList.add('bg-gray-400'); }); }
                            document.getElementById(inputId).value = seatId;
                        };
                    }
                    grid.appendChild(seat);
                }
            });
        }
    </script>
