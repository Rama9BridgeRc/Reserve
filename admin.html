<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบจัดการหลังบ้าน</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #f3f4f6; color: #1f2937; } 
        #global-loader { display: none; position: fixed; inset: 0; background: rgba(255,255,255,0.8); z-index: 9999; align-items: center; justify-content: center; flex-direction: column; }
        #toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .toast { min-width: 250px; padding: 1rem; border-radius: 0.5rem; color: white; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); animation: slideIn 0.3s ease-out forwards; display: flex; align-items: center; gap: 0.5rem; }
        @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        .seat { width: 30px; height: 30px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: bold; color: #4b5563; }
        .seat.standard-available { background-color: #fce7f3; border: 1px solid #f9a8d4; }
        .seat.vip-locked { background-color: #fcd34d !important; border: 1px solid #fbbf24 !important; color: #b45309 !important; }
        .seat.booked { background-color: #ef4444 !important; border: 1px solid #dc2626 !important; color: white !important; }
        .cinema-screen { height: 40px; background: #e5e7eb; border-radius: 4px; margin-bottom: 1rem; display: flex; align-items: center; justify-content: center; font-weight: bold; color: #6b7280; letter-spacing: 0.1em; }
        @media print { body * { visibility: hidden; } #admin-map-print-area, #admin-map-print-area * { visibility: visible; } #admin-map-print-area { position: absolute; left: 0; top: 0; width: 100%; } .print\:hidden { display: none !important; } }
    </style>
</head>
<body class="min-h-screen">

    <div id="global-loader"><i class="fa-solid fa-circle-notch fa-spin text-5xl text-pink-600 mb-4"></i><p class="text-gray-700 font-semibold" id="loader-text">กำลังดำเนินการ...</p></div>

    <div id="admin-login-modal" class="fixed inset-0 bg-gray-900 bg-opacity-75 z-50 flex items-center justify-center backdrop-blur-sm print:hidden">
        <div class="bg-white p-8 rounded-2xl shadow-2xl max-w-sm w-full relative">
            <h2 class="text-2xl font-bold mb-6 text-center text-pink-700">เข้าสู่ระบบผู้ดูแลระบบ</h2>
            <div class="space-y-4">
                <div><label class="text-sm text-gray-600">Username</label><input type="text" id="admin-user" class="w-full border p-3 rounded-lg outline-none focus:border-pink-500"></div>
                <div><label class="text-sm text-gray-600">Password</label><input type="password" id="admin-pass" class="w-full border p-3 rounded-lg outline-none focus:border-pink-500" onkeypress="if(event.key === 'Enter') loginAdmin();"></div>
                <button onclick="loginAdmin()" class="w-full bg-pink-600 hover:bg-pink-700 text-white font-bold py-3 rounded-lg shadow mt-2 transition">เข้าสู่ระบบ</button>
            </div>
        </div>
    </div>

    <div id="admin-dashboard" class="hidden flex-col min-h-screen p-4 md:p-8 z-10 print:hidden">
        <div class="flex flex-col md:flex-row justify-between items-center mb-6 bg-white p-4 rounded-xl shadow-sm gap-4">
            <h1 class="text-2xl font-bold text-pink-800"><i class="fa-solid fa-shield-halved mr-2"></i> ระบบจัดการหลังบ้าน <span id="dash-event-name" class="text-sm text-gray-500 ml-2"></span></h1>
            <div class="flex flex-wrap gap-2 justify-center">
                <button onclick="openAdminBooking()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg text-sm shadow"><i class="fa-solid fa-ticket"></i> จองที่นั่ง (ไม่จำกัด)</button>
                <button onclick="showAdminMap()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm shadow"><i class="fa-solid fa-map"></i> ดูแผนผัง</button>
                <button onclick="exportCSV()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm shadow"><i class="fa-solid fa-file-excel"></i> โหลด CSV</button>
                <button onclick="logoutAdmin()" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg text-sm shadow"><i class="fa-solid fa-power-off"></i> ออกจากระบบ</button>
            </div>
        </div>
        <div class="bg-white p-6 rounded-xl shadow-lg flex-grow overflow-hidden flex flex-col">
            <div class="flex justify-between mb-4 items-center">
                <h2 class="text-xl font-bold text-gray-800">รายการจองที่นั่งทั้งหมด</h2>
                <button onclick="loadAdminData()" class="bg-pink-100 text-pink-700 px-4 py-2 rounded font-bold hover:bg-pink-200 transition"><i class="fa-solid fa-rotate mr-1"></i> รีเฟรชข้อมูล</button>
            </div>
            <div class="overflow-x-auto rounded-lg border border-gray-200 flex-grow">
                <table class="w-full text-sm text-left text-gray-600 whitespace-nowrap">
                    <thead class="text-xs text-gray-700 uppercase bg-gray-100 sticky top-0 shadow-sm">
                        <tr><th class="px-4 py-3">วันเวลาที่จอง</th><th class="px-4 py-3">สมาชิก</th><th class="px-4 py-3">ที่นั่ง</th><th class="px-4 py-3">ชื่อ-สกุล</th><th class="px-4 py-3">เบอร์/อีเมล</th><th class="px-4 py-3">RefCode</th><th class="px-4 py-3 text-center">จัดการ</th></tr>
                    </thead>
                    <tbody id="admin-table-body"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Modal แก้ไขข้อมูล -->
    <div id="admin-edit-modal" class="hidden fixed inset-0 bg-gray-900 bg-opacity-75 z-50 flex items-center justify-center backdrop-blur-sm print:hidden">
        <div class="bg-white p-6 rounded-2xl shadow-2xl max-w-md w-full relative">
            <h2 class="text-xl font-bold mb-4 text-pink-700 border-b pb-2">แก้ไขข้อมูลการจอง</h2>
            <form id="edit-booking-form" class="space-y-3">
                <input type="hidden" id="edit-ref">
                <div><label class="block text-xs font-medium text-gray-700">คำนำหน้า</label>
                    <select id="edit-title" class="w-full border p-2 rounded focus:ring-pink-500 outline-none"><option value="นาย">นาย</option><option value="นาง">นาง</option><option value="นางสาว">นางสาว</option></select>
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div><label class="block text-xs font-medium text-gray-700">ชื่อ</label><input type="text" id="edit-fname" class="w-full border p-2 rounded outline-none"></div>
                    <div><label class="block text-xs font-medium text-gray-700">นามสกุล</label><input type="text" id="edit-lname" class="w-full border p-2 rounded outline-none"></div>
                </div>
                <div><label class="block text-xs font-medium text-gray-700">เบอร์โทรศัพท์</label><input type="text" id="edit-phone" class="w-full border p-2 rounded outline-none"></div>
                <div><label class="block text-xs font-medium text-gray-700">อีเมล</label><input type="text" id="edit-email" class="w-full border p-2 rounded outline-none"></div>
                
                <div class="flex gap-2 mt-4 pt-4 border-t">
                    <button type="button" onclick="saveEditBooking()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-2 rounded">บันทึก</button>
                    <button type="button" onclick="closeEditModal()" class="w-full bg-gray-300 hover:bg-gray-400 text-gray-800 font-bold py-2 rounded">ยกเลิก</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal แผนผังสำหรับพิมพ์ -->
    <div id="admin-map-modal" class="hidden fixed inset-0 bg-white z-[60] flex-col print:flex">
        <div class="p-4 bg-gray-800 text-white flex justify-between items-center print:hidden">
            <h2 class="text-xl font-bold"><i class="fa-solid fa-map-location-dot"></i> แผนผังที่นั่งปัจจุบัน</h2>
            <div class="flex gap-3">
                <button onclick="window.print()" class="bg-blue-500 hover:bg-blue-600 px-4 py-2 rounded font-bold"><i class="fa-solid fa-print"></i> พิมพ์แผนผัง</button>
                <button onclick="closeAdminMap()" class="bg-red-500 hover:bg-red-600 px-4 py-2 rounded font-bold"><i class="fa-solid fa-times"></i> ปิด</button>
            </div>
        </div>
        <div id="admin-map-print-area" class="flex-grow p-4 overflow-auto text-center">
            <h1 class="text-2xl font-bold text-gray-800 mb-2">แผนผังที่นั่ง <span id="admin-map-title"></span></h1>
            <div class="cinema-screen mx-auto max-w-3xl mt-4 mb-6">SCREEN / เวที</div>
            <div class="flex justify-center relative"><div id="admin-seat-grid" style="display: inline-grid; gap: 0.3rem;"></div></div>
            <div class="mt-6 flex flex-wrap justify-center gap-4 text-sm print:hidden">
                <div class="flex items-center gap-1"><div class="w-4 h-4 bg-[#fce7f3] border border-[#f9a8d4]"></div> ว่าง</div>
                <div class="flex items-center gap-1"><div class="w-4 h-4 bg-[#ef4444]"></div> จองแล้ว</div>
                <div class="flex items-center gap-1"><div class="w-4 h-4 bg-[#fcd34d]"></div> VIP</div>
            </div>
        </div>
    </div>

    <div id="toast-container"></div>

    <script>
        // ==========================================
        // 🚨 นำ Web App URL ของ Google Apps Script มาใส่ตรงนี้ 🚨
        // ==========================================
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyWWmbSE1f4LWZ0OWR2JRPJIXZgXtJqLA_I4bdIm73Eqy3l2NmPxCAjkOrmr-v6EX0ZKQ/exec'; 
        
        let adminBookingsData = [];
        let eventNameData = "";
        
        const ROWS = ['A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I', 'J'];
        const SEATS_PER_ROW = 15;
        const VIP_ROWS = ['A', 'E']; 

        async function fetchAPI(action, data = {}) {
            data.action = action;
            try {
                // ติดต่อฐานข้อมูลข้าม Domain ด้วย Fetch API
                const response = await fetch(SCRIPT_URL, { 
                    method: 'POST', 
                    body: JSON.stringify(data), 
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' } 
                });
                return await response.json();
            } catch (error) { throw error; }
        }

        function showLoader(text) { document.getElementById('loader-text').innerText = text; document.getElementById('global-loader').style.display = 'flex'; }
        function hideLoader() { document.getElementById('global-loader').style.display = 'none'; }
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container'); const toast = document.createElement('div');
            let bgClass = type === 'success' ? 'bg-green-600' : type === 'warning' ? 'bg-yellow-500 text-yellow-900' : type === 'error' ? 'bg-red-600' : 'bg-gray-800';
            toast.className = `toast ${bgClass}`; toast.innerHTML = `<span>${message}</span>`; container.appendChild(toast);
            setTimeout(() => { toast.style.animation = 'fadeOut 0.3s ease-out forwards'; setTimeout(() => toast.remove(), 300); }, 3000);
        }

        async function loginAdmin() {
            const u = document.getElementById('admin-user').value; const p = document.getElementById('admin-pass').value;
            if(!u || !p) { showToast('กรุณากรอกข้อมูล', 'warning'); return; }
            showLoader('ตรวจสอบสิทธิ์...');
            try {
                const res = await fetchAPI('login', {username: u, password: p});
                if(res.status === 'success') { 
                    document.getElementById('admin-login-modal').classList.add('hidden'); 
                    document.getElementById('admin-dashboard').classList.remove('hidden'); 
                    document.getElementById('admin-dashboard').classList.add('flex');
                    initDashboard();
                } else { showToast(res.message, "error"); }
            } catch(e) {} hideLoader();
        }

        function logoutAdmin() {
            document.getElementById('admin-dashboard').classList.add('hidden');
            document.getElementById('admin-dashboard').classList.remove('flex');
            document.getElementById('admin-login-modal').classList.remove('hidden');
            document.getElementById('admin-user').value = ''; document.getElementById('admin-pass').value = '';
        }

        async function initDashboard() {
            try {
                const res = await fetchAPI('getSettings');
                if(res.status === 'success') { 
                    eventNameData = res.eventName;
                    document.getElementById('dash-event-name').innerText = `(${res.eventName})`;
                }
            } catch(e){}
            loadAdminData();
        }

        async function loadAdminData() {
            showLoader('กำลังโหลดข้อมูลการจอง...');
            try {
                const res = await fetchAPI('get_bookings');
                if(res.status === 'success') {
                    adminBookingsData = res.data; 
                    const tbody = document.getElementById('admin-table-body'); tbody.innerHTML = '';
                    for(let i=1; i<res.data.length; i++){
                        const row = res.data[i]; const dateObj = new Date(row[0]);
                        const rowHtml = `<tr class="border-b hover:bg-gray-50">
                            <td class="px-4 py-3 text-xs">${dateObj.toLocaleDateString('th-TH')} ${dateObj.toLocaleTimeString('th-TH')}</td>
                            <td class="px-4 py-3 font-semibold text-pink-700">${row[1]}</td>
                            <td class="px-4 py-3"><span class="bg-gray-200 px-2 py-1 rounded font-bold">${row[2]}</span></td>
                            <td class="px-4 py-3">${row[3]} ${row[4]} ${row[5]}</td>
                            <td class="px-4 py-3 text-xs">${row[6]}<br>${row[7]}</td>
                            <td class="px-4 py-3 font-mono font-bold text-gray-500 text-xs">${row[8]}</td>
                            <td class="px-4 py-3 text-center print:hidden">
                                <button onclick="openEditModal('${row[8]}', '${row[3]}', '${row[4]}', '${row[5]}', '${row[6]}', '${row[7]}')" class="text-blue-600 hover:text-white hover:bg-blue-600 px-2 py-1 rounded border border-blue-600 transition text-xs font-bold mr-1">แก้ไข</button>
                                <button onclick="deleteBooking('${row[8]}')" class="text-red-600 hover:text-white hover:bg-red-600 px-2 py-1 rounded border border-red-600 transition text-xs font-bold">ลบ</button>
                            </td></tr>`;
                        tbody.innerHTML += rowHtml;
                    }
                }
            } catch(e) {} hideLoader();
        }

        function openEditModal(ref, title, fname, lname, phone, email) {
            document.getElementById('edit-ref').value = ref; document.getElementById('edit-title').value = title;
            document.getElementById('edit-fname').value = fname; document.getElementById('edit-lname').value = lname;
            document.getElementById('edit-phone').value = phone; document.getElementById('edit-email').value = email;
            document.getElementById('admin-edit-modal').classList.remove('hidden');
        }
        function closeEditModal() { document.getElementById('admin-edit-modal').classList.add('hidden'); }
        async function saveEditBooking() {
            const data = {
                refCode: document.getElementById('edit-ref').value, title: document.getElementById('edit-title').value,
                fname: document.getElementById('edit-fname').value, lname: document.getElementById('edit-lname').value,
                phone: document.getElementById('edit-phone').value, email: document.getElementById('edit-email').value
            };
            closeEditModal(); showLoader('กำลังบันทึก...');
            try {
                const res = await fetchAPI('edit_booking', data);
                if(res.status === 'success') { showToast('อัปเดตข้อมูลสำเร็จ', 'success'); loadAdminData(); }
            } catch(e) { showToast('เกิดข้อผิดพลาด', 'error'); } hideLoader();
        }

        async function deleteBooking(refCode) {
            if(!confirm(`ยืนยันการลบข้อมูล Ref: ${refCode} ใช่หรือไม่?`)) return;
            showLoader('กำลังลบ...');
            try { const res = await fetchAPI('delete_booking', {refCode: refCode}); if(res.status === 'success') { showToast('ลบการจองสำเร็จ', 'success'); loadAdminData(); } } catch(e) {} hideLoader();
        }

        function exportCSV() {
            if (adminBookingsData.length <= 1) { showToast('ไม่มีข้อมูลให้ดาวน์โหลด', 'warning'); return; }
            let csvContent = "data:text/csv;charset=utf-8,\uFEFF"; 
            csvContent += "วันเวลาที่จอง,ศูนย์นันทนาการ (สมาชิก),ที่นั่ง,คำนำหน้า,ชื่อ,นามสกุล,เบอร์โทร,อีเมล,RefCode\n";
            for(let i=1; i<adminBookingsData.length; i++){
                let row = adminBookingsData[i]; let dateStr = new Date(row[0]).toLocaleString('th-TH');
                let rowData = `"${dateStr}","${row[1]}","${row[2]}","${row[3]}","${row[4]}","${row[5]}","${row[6]}","${row[7]}","${row[8]}"`;
                csvContent += rowData + "\n";
            }
            var encodedUri = encodeURI(csvContent); var link = document.createElement("a");
            link.setAttribute("href", encodedUri); link.setAttribute("download", "รายงานการจองที่นั่ง.csv");
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
        }

        function openAdminBooking() {
            // เปิดหน้า index.html (หน้าบ้าน) พร้อมโหมดแอดมินจองไม่อั้น
            window.open("index.html?admin=true", "_blank");
        }

        async function showAdminMap() {
            document.getElementById('admin-map-modal').classList.remove('hidden');
            document.getElementById('admin-map-title').innerText = eventNameData;
            showLoader('กำลังโหลดแผนผัง...');
            try {
                const response = await fetchAPI('getSeats');
                if (response.status === 'success') {
                    let seatsMap = response.data || {};
                    const grid = document.getElementById('admin-seat-grid');
                    grid.style.gridTemplateColumns = `auto repeat(${SEATS_PER_ROW}, minmax(0, 1fr))`; grid.innerHTML = '';
                    ROWS.forEach(row => {
                        const label = document.createElement('div'); label.className = "flex items-center justify-center font-bold text-gray-500 pr-2 text-xs"; label.innerText = row; grid.appendChild(label);
                        const isVIP = VIP_ROWS.includes(row);
                        for (let i = 1; i <= SEATS_PER_ROW; i++) {
                            const seatId = `${row}${i}`; const seat = document.createElement('div');
                            if (isVIP) { seat.className = 'seat vip-locked'; seat.innerText = 'VIP'; } 
                            else { 
                                seat.className = 'seat standard-available'; seat.innerText = seatId; 
                                if(seatsMap[seatId] && seatsMap[seatId].status === 'booked') { seat.className = 'seat booked'; }
                            }
                            grid.appendChild(seat);
                        }
                    });
                }
            } catch(e) { showToast('ไม่สามารถโหลดแผนผังได้', 'error'); } hideLoader();
        }
        function closeAdminMap() { document.getElementById('admin-map-modal').classList.add('hidden'); }
    </script>
</body>
</html>
